services:
  # 1. Python REST API Backend Microservice
  - type: web
    name: navifreight
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production

  # 2. React Vite Web Frontend (100% Free Edge CDN, Never Sleeps)
  - type: static
    name: navifreight-web
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://navifreight.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
