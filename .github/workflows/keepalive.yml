name: Keep Render Backend Awake 24/7

on:
  schedule:
    # Run every 10 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping NaviFreight Render Backend
        run: |
          echo "Pinging https://navifreight.onrender.com/api/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://navifreight.onrender.com/api/health)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Warning: Received HTTP $HTTP_STATUS, retrying..."
            sleep 5
            curl -sI https://navifreight.onrender.com/api/health
          fi
